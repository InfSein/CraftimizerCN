name: Build and Release Plugin

on:
  push:
    branches:
      - main

env:
  PROJECT_NAME: CraftimizerCN

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Download Dalamud
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip latest.zip -d dalamud/
          echo "DALAMUD_HOME=$PWD/dalamud" >> $GITHUB_ENV

      - name: Restore
        run: |
          dotnet restore -r win

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore

      - name: Get commit hash
        id: get_hash
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag build-${{ steps.get_hash.outputs.short_sha }}
          git push origin build-${{ steps.get_hash.outputs.short_sha }}

      - name: Get version from package.json
        id: get_version
        run: |
          version="v$(node -p 'require("./manifest.json")[0].AssemblyVersion')"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get last commit message
        id: get_commit
        run: |
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$(git log -1 --pretty=format:%B)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Parse changelog and PR number
        id: parse_changelog
        run: |
          msg="${{ steps.get_commit.outputs.msg }}"
          pr_number=$(echo "$msg" | grep -oP '#\d+' | head -n 1 || true)
          changelog=$(echo "$msg" | sed '1d')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package release files
        run: |
          cd ${{ env.PROJECT_NAME }}/bin/x64/Release
          zip -r latest.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        id: release
        with:
          tag_name: build-${{ steps.get_hash.outputs.short_sha }}
          name: "Release ${{ steps.get_version.outputs.version }} (${{ steps.get_hash.outputs.short_sha }})"
          files: ${{env.PROJECT_NAME}}/bin/x64/Release/latest.zip
          body: |
            This is an automatic build from commit `${{ steps.get_hash.outputs.short_sha }}`.

            **RELEASE NOTE:**
            ${{ steps.parse_changelog.outputs.changelog }}

            **Version**: ${{ steps.get_version.outputs.version }}
            **PR(s)**: ${{ steps.parse_changelog.outputs.pr_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
